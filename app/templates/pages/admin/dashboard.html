<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ulasCheck Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
    <body class="bg-gray-100 min-h-screen flex">
        {% include 'components/sidebar.html' %}
        <div class="flex-1 p-6">
            {% include 'components/header.html' %}
            <main class="mt-6">
                {% block content %}
                <div class="bg-white shadow rounded-lg p-6 mb-3">
                    <h1 class="text-2xl font-semibold text-gray-800 mb-4">Halo,</h1>
                    <p class="text-l text-gray-600">Selamat datang di halaman dashboard admin ulasCheck.</p>
                </div>

                <div class="bg-white shadow rounded-lg p-6">
                    <p class="text-gray-600">Anda sedang login sebagai Admin.</p>
                </div>
                {% endblock %}
            </main>
        </div>
    </body>
</html>
