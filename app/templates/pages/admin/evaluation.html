<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluasi Model - ulasCheck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- WRAPPER FLEX: SIDEBAR + MAIN -->
  <div class="flex min-h-screen">
    
    <!-- SIDEBAR -->
    {% include 'components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-6">
      
      <!-- HEADER -->
      {% include 'components/header.html' %}

      <!-- PAGE CONTENT -->
      <main class="flex-1 p-6 bg-gray-100">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-5xl mx-auto">
          <h1 class="text-2xl font-bold text-gray-800 mb-6">📊 Evaluasi Model</h1>

          <!-- Tombol Aksi -->
          <div class="mb-6 flex space-x-4">
            <button onclick="trainModel()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">Latih Model</button>
            <button onclick="saveEvaluation()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm">Simpan ke Database</button>
          </div>

          <!-- Chart -->
          <canvas id="evalChart" height="120" class="mb-8"></canvas>

          <!-- Tabel Hasil -->
          <div class="overflow-x-auto">
            <table class="min-w-full border text-sm text-center">
              <thead class="bg-gray-200 font-semibold text-gray-700">
                <tr>
                  <th class="border px-4 py-2">Model</th>
                  <th class="border px-4 py-2">Akurasi</th>
                  <th class="border px-4 py-2">Presisi</th>
                  <th class="border px-4 py-2">Recall</th>
                  <th class="border px-4 py-2">F1 Score</th>
                  <th class="border px-4 py-2">Waktu Proses (s)</th>
                </tr>
              </thead>
              <tbody id="evalTable" class="bg-white">
                <!-- Diisi dari JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    let evalData = [];

    async function trainModel() {
      const res = await fetch("/train-svm");
      const data = await res.json();
      evalData = data.results || [];
      renderTable();
      renderChart();
      alert("✅ Training selesai");
    }

    async function saveEvaluation() {
      const res = await fetch("/save-evaluation", { method: "POST" });
      const data = await res.json();
      alert(data.message || "Berhasil disimpan");
    }

    function renderTable() {
      const tbody = document.getElementById("evalTable");
      tbody.innerHTML = "";
      evalData.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td class="border px-4 py-2">${row.model}</td>
            <td class="border px-4 py-2">${(row.accuracy * 100).toFixed(2)}%</td>
            <td class="border px-4 py-2">${(row.precision * 100).toFixed(2)}%</td>
            <td class="border px-4 py-2">${(row.recall * 100).toFixed(2)}%</td>
            <td class="border px-4 py-2">${(row.f1_score * 100).toFixed(2)}%</td>
            <td class="border px-4 py-2">${row.time_process.toFixed(2)}</td>
          </tr>
        `;
      });
    }

    function renderChart() {
      const ctx = document.getElementById("evalChart").getContext("2d");
      const labels = evalData.map(e => e.model);
      const accuracy = evalData.map(e => e.accuracy * 100);
      const precision = evalData.map(e => e.precision * 100);
      const recall = evalData.map(e => e.recall * 100);
      const f1 = evalData.map(e => e.f1_score * 100);

      new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            { label: "Akurasi", data: accuracy, backgroundColor: "#3b82f6" },
            { label: "Presisi", data: precision, backgroundColor: "#10b981" },
            { label: "Recall", data: recall, backgroundColor: "#facc15" },
            { label: "F1 Score", data: f1, backgroundColor: "#ef4444" }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'top' },
            title: { display: true, text: 'Perbandingan Evaluasi Model' }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              title: { display: true, text: 'Persentase (%)' }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
