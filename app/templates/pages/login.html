<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-100 via-yellow-100 to-white min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-6 bg-white p-6 sm:p-8 rounded-2xl shadow-xl">
    <a href="/" class="flex flex-col items-center justify-center mb-6 group transition text-center">
      <div class="bg-gradient-to-br from-orange-500 to-yellow-400 rounded-full p-3 shadow-lg mb-2 group-hover:scale-105 transition-transform duration-300">
        <img src="https://img.icons8.com/ios-filled/36/ffffff/search.png" alt="Logo" class="h-6 w-6" />
      </div>
      <span class="text-4xl font-extrabold tracking-wide text-gray-800 group-hover:text-orange-600 transition-colors duration-300">
        Shop<span class="text-yellow-400">erra</span>
      </span>
    </a>

    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-800">Selamat Datang 👋</h2>
      <p class="mt-1 text-sm text-gray-500">Silakan login untuk masuk ke halaman admin</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="text-sm text-center">
          {% for category, message in messages %}
            <p class="{% if category == 'error' %}text-red-600{% else %}text-green-600{% endif %}">
              {{ message }}
            </p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('main.login_submit') }}" method="POST" class="space-y-5" autocomplete="off">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300 pr-10" />
          <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-orange-600 transition">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path id="eyeOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path id="eyeOpen2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              <path id="eyeClosed" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.977 9.977 0 013.176-4.568M6.106 6.106A9.967 9.967 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.974 9.974 0 01-4.423 5.618M6.106 6.106L18 18" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit"
              class="w-full py-2 px-4 bg-orange-600 text-white font-semibold rounded-lg hover:bg-orange-700 transition duration-300">
        Login
      </button>
    </form>
  </div>
</body>
</html>
<script>
  function togglePassword() {
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeOpen2 = document.getElementById("eyeOpen2");
    const eyeClosed = document.getElementById("eyeClosed");

    const isHidden = passwordInput.type === "password";

    passwordInput.type = isHidden ? "text" : "password";

    eyeOpen.classList.toggle("hidden", !isHidden);
    eyeOpen2.classList.toggle("hidden", !isHidden);
    eyeClosed.classList.toggle("hidden", isHidden);
  }
</script>
